name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Determine release plan
        id: plan
        run: node scripts/prepare-release.mjs
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_TAG: ${{ inputs.tag }}

      - name: Run verification checks
        if: steps.plan.outputs.should_release == 'true'
        run: |
          npm run check:all
          npm test

      - name: Package extension zip
        if: steps.plan.outputs.should_release == 'true'
        run: |
          chmod +x pack.sh
          ./pack.sh "${{ steps.plan.outputs.version }}"

      - name: Publish GitHub Release
        if: steps.plan.outputs.should_release == 'true'
        run: |
          TAG="${{ steps.plan.outputs.tag }}"
          ZIP_FILE="$HOME/lumeo-${TAG}.zip"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating asset and notes..."
            gh release upload "$TAG" "$ZIP_FILE" --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "$ZIP_FILE" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
