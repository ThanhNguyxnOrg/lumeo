name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: |
          npm run check:all
          npm test

      - name: Package extension zip
        id: pack
        run: |
          chmod +x pack.sh
          ./pack.sh
          VERSION=$(node -p "require('./manifest.json').version")
          ZIP_PATH="$HOME/lumeo-v${VERSION}.zip"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" == "main" ]]; then
            TAG_NAME="${{ inputs.tag }}"
          fi
          ZIP_FILE="${{ steps.pack.outputs.zip_path }}"
          
          # Extract release notes from CHANGELOG.md for this version if available
          node -e "
            const fs = require('fs');
            const log = fs.readFileSync('CHANGELOG.md', 'utf8');
            const match = log.match(/## \[${{ steps.pack.outputs.version }}\][\s\S]*?(?=\n## \[|$)/);
            if (match) {
              fs.writeFileSync('RELEASE_NOTES.md', match[0]);
            } else {
              fs.writeFileSync('RELEASE_NOTES.md', 'Release ' + '$TAG_NAME');
            }
          "
          
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading/updating asset..."
            gh release upload "$TAG_NAME" "$ZIP_FILE" --clobber
            gh release edit "$TAG_NAME" --notes-file RELEASE_NOTES.md
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" "$ZIP_FILE" \
              --title "$TAG_NAME — Production Release" \
              --notes-file RELEASE_NOTES.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
