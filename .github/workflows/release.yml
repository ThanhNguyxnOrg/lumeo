name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.8). Must match manifest.json."
        required: false
        default: ""
      source_ref:
        description: "Optional ref to build from (defaults to the tag). Use a branch to repackage a store fix at the same version."
        required: false
        default: ""
      stores:
        description: "Store steps to run."
        required: true
        default: both
        type: choice
        options:
          - both
          - amo
          - edge
          - none

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Manual runs must build the tag they were asked for, not the tip of
          # the default branch. source_ref allows a same-version repackage
          # (for example an Edge manifest fix) without moving the tag.
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate version metadata
        run: npm run check:versions

      - name: Determine release plan
        id: plan
        run: node scripts/prepare-release.mjs
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_TAG: ${{ inputs.tag }}

      - name: Determine store plan
        id: stores
        env:
          STORES_INPUT: ${{ inputs.stores }}
        run: |
          case "${STORES_INPUT:-both}" in
            both) echo "amo=true" >> "$GITHUB_OUTPUT"; echo "edge=true" >> "$GITHUB_OUTPUT" ;;
            amo)  echo "amo=true" >> "$GITHUB_OUTPUT"; echo "edge=false" >> "$GITHUB_OUTPUT" ;;
            edge) echo "amo=false" >> "$GITHUB_OUTPUT"; echo "edge=true" >> "$GITHUB_OUTPUT" ;;
            none) echo "amo=false" >> "$GITHUB_OUTPUT"; echo "edge=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown stores input: ${STORES_INPUT}"; exit 1 ;;
          esac

      - name: Validate release tag
        if: steps.plan.outputs.should_release == 'true'
        run: node scripts/check-versions.mjs --tag "${{ steps.plan.outputs.tag }}"

      - name: Run verification checks
        if: steps.plan.outputs.should_release == 'true'
        run: |
          npm run check:all
          npm test
          npm run check:manifest

      - name: Build all store packages
        if: steps.plan.outputs.should_release == 'true'
        env:
          GECKO_ID: ${{ vars.GECKO_ID || 'lumeo@thanhnguyxn.org' }}
        run: |
          node scripts/build-targets.mjs --out dist --version "${{ steps.plan.outputs.version }}"
          for f in dist/*.zip; do unzip -t "$f" >/dev/null; done

      - name: Verify packaged manifest versions
        if: steps.plan.outputs.should_release == 'true'
        run: |
          set -e
          for f in dist/*.zip; do
            VERSION=$(unzip -p "$f" manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")
            test "$VERSION" = "${{ steps.plan.outputs.version }}" || {
              echo "::error::$f contains manifest version $VERSION, expected ${{ steps.plan.outputs.version }}"
              exit 1
            }
          done

      # Firefox listed channel: web-ext creates the AMO listing on first run and
      # adds the version on later runs. AMO hosts the signed XPI, so there is no
      # XPI asset to attach to the GitHub release. This step is skipped until
      # the free AMO API credentials are configured as repository secrets.
      - name: Submit Firefox package to AMO
        id: amo
        if: steps.plan.outputs.should_release == 'true' && steps.stores.outputs.amo == 'true'
        # A store API hiccup must not block the GitHub Release assets.
        continue-on-error: true
        env:
          # Org-level names stay store-specific and symmetric with EDGE_*.
          # web-ext itself expects WEB_EXT_API_KEY / WEB_EXT_API_SECRET, so we
          # map them here. The old names are still accepted as a fallback.
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY || secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET || secrets.WEB_EXT_API_SECRET }}
        run: |
          # Secrets pasted from a store console can carry a trailing CR/LF or
          # spaces. Trim before signing; otherwise the HMAC key differs and AMO
          # answers with the misleading "Error decoding signature".
          trim() {
            local value="$1"
            value="$(printf '%s' "$value" | tr -d '\r')"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          WEB_EXT_API_KEY="$(trim "${WEB_EXT_API_KEY:-}")"
          WEB_EXT_API_SECRET="$(trim "${WEB_EXT_API_SECRET:-}")"
          export WEB_EXT_API_KEY WEB_EXT_API_SECRET
          if [ -z "${WEB_EXT_API_KEY:-}" ] || [ -z "${WEB_EXT_API_SECRET:-}" ]; then
            echo "::notice::Skipping AMO submission; add AMO_API_KEY and AMO_API_SECRET organization secrets to enable it."
            exit 0
          fi
          case "$WEB_EXT_API_KEY" in
            user:*)
              echo "AMO credential shape: issuer-like key, key_length=${#WEB_EXT_API_KEY}, secret_length=${#WEB_EXT_API_SECRET}"
              ;;
            *)
              echo "::warning::AMO_API_KEY does not look like a JWT issuer (expected user:<id>:<id>); confirm the key and secret are not swapped."
              ;;
          esac
          npx --yes web-ext@10.8.0 sign \
            --source-dir dist/firefox \
            --channel listed \
            --amo-metadata store-assets/amo-metadata.json \
            --artifacts-dir dist/amo \
            --approval-timeout 0 \
            --no-input

      # Microsoft Edge Add-ons: first publication is manual in Partner Center;
      # later versions use the free Update REST API v1.1. Skipped until the
      # EDGE_PRODUCT_ID / EDGE_API_KEY / EDGE_CLIENT_ID secrets exist.
      - name: Update Microsoft Edge Add-ons
        id: edge
        if: steps.plan.outputs.should_release == 'true' && steps.stores.outputs.edge == 'true'
        # A store API hiccup must not block the GitHub Release assets.
        continue-on-error: true
        env:
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID || secrets.EDGE_PRODUCT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
        run: |
          # Same copy/paste guard as the AMO step: a trailing newline in the
          # Product ID makes curl reject the API URL with exit code 3.
          trim() {
            local value="$1"
            value="$(printf '%s' "$value" | tr -d '\r')"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          EDGE_PRODUCT_ID="$(trim "${EDGE_PRODUCT_ID:-}")"
          EDGE_API_KEY="$(trim "${EDGE_API_KEY:-}")"
          EDGE_CLIENT_ID="$(trim "${EDGE_CLIENT_ID:-}")"
          if [ -z "${EDGE_PRODUCT_ID:-}" ] || [ -z "${EDGE_API_KEY:-}" ] || [ -z "${EDGE_CLIENT_ID:-}" ]; then
            echo "::notice::Skipping Edge update; add EDGE_PRODUCT_ID, EDGE_API_KEY and EDGE_CLIENT_ID secrets to enable it."
            exit 0
          fi
          if ! printf '%s' "$EDGE_PRODUCT_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::EDGE_PRODUCT_ID is not a GUID after trimming; copy the Product ID from Partner Center."
            exit 1
          fi

          EDGE_ZIP="$(ls dist/*-edge.zip | head -n1)"
          API="https://api.addons.microsoftedge.microsoft.com/v1"
          AUTH=(-H "Authorization: ApiKey ${EDGE_API_KEY}" -H "X-ClientID: ${EDGE_CLIENT_ID}")

          read_status() {
            local body="$1"
            printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).status||'InProgress')}catch{process.stdout.write('InProgress')}})"
          }

          upload_headers="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$upload_headers" -w "%{http_code}" -X POST \
            "${AUTH[@]}" -H "Content-Type: application/zip" -T "$EDGE_ZIP" \
            "$API/products/${EDGE_PRODUCT_ID}/submissions/draft/package")"
          if [ "$code" != "202" ]; then
            echo "::error::Edge package upload returned HTTP $code"
            cat "$upload_headers"
            exit 1
          fi
          upload_op="$(grep -i '^location:' "$upload_headers" | tail -n1 | tr -d '\r' | awk '{print $2}' | awk -F/ '{print $NF}')"

          upload_status="InProgress"
          for _ in $(seq 1 30); do
            upload_body="$(curl -sS "${AUTH[@]}" "$API/products/${EDGE_PRODUCT_ID}/submissions/draft/package/operations/${upload_op}")"
            upload_status="$(read_status "$upload_body")"
            [ "$upload_status" = "Succeeded" ] && break
            if [ "$upload_status" = "Failed" ]; then
              echo "::error::Edge package upload failed: $upload_body"
              exit 1
            fi
            sleep 5
          done
          if [ "$upload_status" != "Succeeded" ]; then
            echo "::error::Edge package upload did not finish (status: $upload_status)."
            exit 1
          fi

          publish_headers="$(mktemp)"
          code="$(curl -sS -o /dev/null -D "$publish_headers" -w "%{http_code}" -X POST \
            "${AUTH[@]}" -H "Content-Type: application/json" \
            -d '{"notes":"Automated update from the Lumeo release workflow."}' \
            "$API/products/${EDGE_PRODUCT_ID}/submissions")"
          if [ "$code" != "202" ]; then
            echo "::error::Edge publish request returned HTTP $code"
            cat "$publish_headers"
            exit 1
          fi
          publish_op="$(grep -i '^location:' "$publish_headers" | tail -n1 | tr -d '\r' | awk '{print $2}' | awk -F/ '{print $NF}')"

          publish_status="InProgress"
          for _ in $(seq 1 30); do
            publish_body="$(curl -sS "${AUTH[@]}" "$API/products/${EDGE_PRODUCT_ID}/submissions/operations/${publish_op}")"
            publish_status="$(read_status "$publish_body")"
            [ "$publish_status" = "Succeeded" ] && break
            if [ "$publish_status" = "Failed" ]; then
              echo "::error::Edge publish failed: $publish_body"
              exit 1
            fi
            sleep 5
          done
          if [ "$publish_status" != "Succeeded" ]; then
            echo "::error::Edge publish did not finish (status: $publish_status)."
            exit 1
          fi
          echo "Edge Add-ons update submitted."

      - name: Generate GitHub App Token
        if: steps.plan.outputs.should_release == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Publish GitHub Release
        if: steps.plan.outputs.should_release == 'true'
        run: |
          TAG="${{ steps.plan.outputs.tag }}"
          ASSETS=(dist/*.zip dist/SHA256SUMS.txt dist/build-metadata.json)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets and notes..."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Store submission summary
        if: always() && steps.plan.outputs.should_release == 'true'
        run: |
          echo "Firefox AMO step: ${{ steps.amo.outcome || 'skipped' }}"
          echo "Microsoft Edge step: ${{ steps.edge.outcome || 'skipped' }}"
          if [ "${{ steps.amo.outcome }}" = "failure" ] || [ "${{ steps.edge.outcome }}" = "failure" ]; then
            echo "::warning::One or more store submissions failed; the GitHub Release assets were still published."
          fi
