# Managed by ThanhNguyxnAgent Auto-Onboarding. Do not edit this file manually.
name: ThanhNguyxnAgent PR Event Signal

# zizmor: ignore[dangerous-triggers] -- base-branch workflow; no secrets, write token, checkout, or PR-code execution; emits only GitHub-supplied event metadata.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_run:
    workflows: ["Test Suite", "Node.js CI"]
    types: [completed]

# pull_request_target executes this workflow from the base repository's default
# branch. Keep it metadata-only: no checkout, no secrets, no write permissions.
permissions: {}

jobs:
  signal:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.pull_requests[0].number != null)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Write the PR event metadata
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.pull_requests[0].head.sha || github.event.workflow_run.head_sha }}
          EVENT_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.pull_requests[0].head.repo.full_name || github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const payload = {
            repository: process.env.EVENT_REPOSITORY || '',
            pr_number: Number(process.env.EVENT_PR_NUMBER),
            head_sha: process.env.EVENT_PR_HEAD_SHA || '',
            head_repository: process.env.EVENT_PR_HEAD_REPOSITORY || ''
          };

          if (!payload.repository || !Number.isSafeInteger(payload.pr_number) || payload.pr_number < 1) {
            throw new Error('GitHub did not provide a valid repository and pull request number');
          }
          if (!/^[0-9a-f]{40}$/i.test(payload.head_sha)) {
            throw new Error('GitHub did not provide a valid pull request head SHA');
          }
          fs.writeFileSync('agent-pr-event.json', JSON.stringify(payload) + '\n', { mode: 0o600 });
          NODE
      - name: Upload the metadata-only event envelope
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: agent-pr-event-${{ github.run_id }}
          path: agent-pr-event.json
          if-no-files-found: error
          retention-days: 1
