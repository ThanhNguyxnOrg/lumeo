name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@5d251b08e6d0360e2eee2da4f792bd179d87ccc9
    with:
      job_name: lint-and-syntax
      node_version: "22"
      package_manager: npm
      cache: npm
      validation_command: |
        node scripts/check-versions.mjs
        node scripts/check-manifest.mjs
        node -e "const m=JSON.parse(require('fs').readFileSync('store-assets/amo-metadata.json','utf8')); if (!m.summary?.['en-US'] || !m.categories?.length || !m.version?.license) throw new Error('amo-metadata.json is missing first-submission fields'); console.log('amo-metadata.json OK');"
      lint_command: npm run check:all
      test_command: npm test
      build_command: npm run build:targets
      post_build_command: |
        set -euo pipefail
        for f in dist/*.zip; do unzip -t "$f" >/dev/null; done
        unzip -p dist/lumeo-v*-firefox.zip manifest.json > /tmp/firefox-manifest.json
        node -e "const m=require('/tmp/firefox-manifest.json'); if (!m.background?.scripts || m.background?.service_worker) throw new Error('Firefox background transform missing'); if (!m.browser_specific_settings?.gecko?.id) throw new Error('Firefox gecko id missing');"
        echo "target archives OK"
