# Managed by ThanhNguyxnAgent Auto-Onboarding. Do not edit this file manually.
name: ThanhNguyxnAgent PR Event Worker

# zizmor: ignore[dangerous-triggers] -- downstream worker downloads only the signal's validated metadata artifact and never executes PR code.
on:
  workflow_run:
    workflows:
      - ThanhNguyxnAgent PR Event Signal
    types: [completed]

# This workflow runs after the metadata-only signal. It receives only the two
# Agent secrets required by the central reusable workflow.
permissions:
  actions: read
  contents: read

# Serialize all PR event workers per repository. Multiple check-run completions
# can signal the same PR at once; per-run locking would allow racing merge calls.
concurrency:
  group: agent-pr-events-${{ github.event.workflow_run.repository.full_name }}
  cancel-in-progress: false

jobs:
  process:
    if: >-
      (github.event.workflow_run.event == 'pull_request_target' ||
       github.event.workflow_run.event == 'workflow_run') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.owner.login == 'ThanhNguyxnOrg'
    uses: ThanhNguyxnOrg/.github/.github/workflows/agent-pr-worker.yml@main
    with:
      repository_owner: ${{ github.event.workflow_run.repository.owner.login }}
      repository_name: ${{ github.event.workflow_run.repository.name }}
      workflow_run_id: ${{ github.event.workflow_run.id }}
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
