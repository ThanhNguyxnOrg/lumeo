# Managed by ThanhNguyxnAgent Auto-Onboarding. Do not edit this file manually.
name: ThanhNguyxnAgent PR Event Worker

# zizmor: ignore[dangerous-triggers] -- this workflow admits only the trusted Signal artifact; it never downloads or executes PR source code.
on:
  workflow_run:
    workflows:
      - ThanhNguyxnAgent PR Event Signal
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: Validate metadata signal artifact
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.event.outputs.pr_number }}
    steps:
      - name: Find the metadata-only signal artifact
        id: artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          node --input-type=module <<'NODE'
          const repository = String(process.env.REPOSITORY || '');
          const runId = String(process.env.RUN_ID || '');
          const token = String(process.env.GITHUB_TOKEN || '');
          const api = 'https://api.github.com';
          if (!repository || !/^\d+$/.test(runId) || !token) {
            throw new Error('Repository, workflow run ID, and GITHUB_TOKEN are required');
          }

          const response = await fetch(
            `${api}/repos/${repository}/actions/runs/${runId}/artifacts?per_page=100`,
            {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
              }
            }
          );
          if (!response.ok) {
            throw new Error(`Artifact lookup failed (${response.status}): ${await response.text()}`);
          }
          const body = await response.json();
          if (!Array.isArray(body.artifacts)) {
            throw new Error('GitHub did not return an artifact list');
          }

          const wanted = `agent-pr-event-${runId}`;
          const present = body.artifacts.some(artifact => artifact.name === wanted && artifact.expired !== true);
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `present=${present}\n`);
          NODE

      - name: Download the metadata-only event envelope
        if: steps.artifact.outputs.present == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-pr-event-${{ github.event.workflow_run.id }}
          path: agent-event
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate the PR identity for queue admission
        id: event
        if: steps.artifact.outputs.present == 'true'
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync('agent-event/agent-pr-event.json', 'utf8'));
          const expectedRepository = String(process.env.EXPECTED_REPOSITORY || '').toLowerCase();
          const repository = String(payload.repository || '').toLowerCase();
          const prNumber = Number(payload.pr_number);
          const headSha = String(payload.head_sha || '').toLowerCase();
          const headRepository = String(payload.head_repository || '');
          const sourceEvent = String(payload.source_event || '');

          if (!['pull_request', 'pull_request_target'].includes(sourceEvent)) {
            throw new Error('Event artifact is not from a pull_request or pull_request_target event');
          }
          if (!expectedRepository || repository !== expectedRepository) {
            throw new Error('Event artifact repository does not match this repository');
          }
          if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
            throw new Error('Event artifact contains an invalid pull request number');
          }
          if (!/^[0-9a-f]{40}$/.test(headSha)) {
            throw new Error('Event artifact contains an invalid pull request head SHA');
          }
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(headRepository)) {
            throw new Error('Event artifact contains an invalid head repository');
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `pr_number=${prNumber}\n`);
          NODE

  process:
    name: Process PR ${{ needs.validate.outputs.pr_number }}
    needs: validate
    if: >-
      needs.validate.outputs.pr_number != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request_target' ||
       github.event.workflow_run.event == 'workflow_run') &&
      github.event.workflow_run.repository.owner.login == 'ThanhNguyxnOrg'
    concurrency:
      group: agent-pr-events-${{ github.event.workflow_run.repository.full_name }}
      cancel-in-progress: false
      queue: max
    uses: ThanhNguyxnOrg/.github/.github/workflows/agent-pr-worker.yml@8e10198b09918169c1ddd5a2dc0c77a4c01047ca
    with:
      repository_owner: ${{ github.event.workflow_run.repository.owner.login }}
      repository_name: ${{ github.event.workflow_run.repository.name }}
      workflow_run_id: ${{ github.event.workflow_run.id }}
      policy_ref: 8e10198b09918169c1ddd5a2dc0c77a4c01047ca
    secrets:
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
