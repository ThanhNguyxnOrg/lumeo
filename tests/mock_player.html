<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lumeo Manual Test Player</title>
  <link rel="stylesheet" href="../content.css">
  <style>
    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      margin-bottom: 20px;
      font-size: 14px;
    }
    #movie_player {
      position: relative;
      width: 854px;
      height: 480px;
      background: #18181b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #27272a;
    }
    video {
      width: 100%;
      height: 100%;
      background: #000;
    }
    .test-log {
      margin-top: 20px;
      width: 854px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 13px;
      color: #10b981;
    }
  </style>
</head>
<body>
  <h1>🎬 Lumeo Subtitle Overlay & AI Context Popover Test</h1>
  <p>Verifying Word Lookup, '✨ AI Context' Button, Close (✕), Escape Key & Click-Outside Dismissals</p>

  <div id="movie_player">
    <video class="html5-main-video"></video>
    <div class="ytp-caption-window-container" style="position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: yellow; padding: 4px 8px; font-size: 18px; z-index: 20;">
      [Native YouTube Caption That Should Be Hidden]
    </div>
    <div class="ytp-chrome-bottom" style="position: absolute; bottom: 0; left: 0; right: 0; height: 48px; background: rgba(0,0,0,0.8); display: flex; justify-content: flex-end; align-items: center; padding: 0 12px; z-index: 50;">
      <div class="ytp-right-controls" style="display: flex; height: 100%; align-items: center;">
        <button class="ytp-subtitles-button ytp-button" style="width: 48px; height: 100%; background: none; border: none; color: #fff; cursor: pointer; font-size: 14px;">CC</button>
        <button class="ytp-settings-button ytp-button" style="width: 48px; height: 100%; background: none; border: none; color: #fff; cursor: pointer; font-size: 18px;">⚙</button>
      </div>
    </div>
  </div>

  <div class="test-log" id="testLog">Ready for subtitle injection...</div>

  <script src="../lib/browser-api.js"></script>
  <script src="../ui/overlay.js"></script>
  <script src="../ui/subtitle-overlay.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // Initialize subtitle overlay
      const subController = window.LumeoSubtitleOverlay.createSubtitleOverlayController();
      subController.build();
      subController.updateCue({
        text: "The mysterious traveler arrived early today.",
        translated: "Người du hành bí ẩn đã đến sớm hôm nay."
      }, {
        targetLanguage: "vi",
        captionStyle: {
          showTranslatedSub: true,
          showSourceSub: true,
          fontSize: 24,
          bottomOffset: 14
        }
      });
      window.testSubController = subController;

      // Initialize control bar overlay button
      const overlayController = window.LumeoOverlay.createOverlayController({
        collapsedOnStart: false,
        onButtonClick: () => {
          overlayController.toggleSideCollapsed();
          document.getElementById("testLog").textContent = "Lumeo control button clicked! Overlay toggled.";
        }
      });
      overlayController.build();
      overlayController.ensureYouTubeControlButton();
      window.testOverlayController = overlayController;

      document.getElementById("testLog").textContent = "Active Cue: 'The mysterious traveler arrived early today.' -> In-player button inserted next to ⚙!";
    });
  </script>
</body>
</html>
